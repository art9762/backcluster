name: BackCluster diagnostics

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backcluster-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: scripts/check.sh
      - run: ./backcluster --version

  apple-security:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      # The runner defaults to Xcode 16.4; upstream uses Metal 4 (Xcode 26+).
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: tests/security/run.sh
      - name: Check iOS worker Objective-C++ syntax
        run: |
          BC_ENGINE_SOURCE=$(python3 -m tools.backcluster.engine_overlay --source-path --header ios/Backburner/Sidecar/BackClusterEngine.h)
          xcrun --sdk iphoneos clang++ -std=c++17 -fobjc-arc -fblocks -fsyntax-only \
            -target arm64-apple-ios16.4 \
            -I"$BC_ENGINE_SOURCE" -I"$BC_ENGINE_SOURCE/include" -I"$BC_ENGINE_SOURCE/ggml/include" -I"$BC_ENGINE_SOURCE/ggml/src/ggml-metal" \
            ios/Backburner/Sidecar/RPCBridge.mm

  native-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and compare full versus three-stage CPU inference
        run: scripts/test-native-pipeline.sh --jobs 3

  apple-build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the pinned Mac server
        run: ./backcluster build
      - name: Check the compiled launcher options
        run: |
          llama.cpp/build-metal/bin/llama-server --help > /tmp/server-help.txt
          for option in --load-mode --spec-type --alias --cache-type-k --cache-type-v; do
            grep -q -- "$option" /tmp/server-help.txt
          done
      - name: Archive the complete iPhone and iPad app
        run: IPA=1 JOBS=3 scripts/build-backcluster.sh
      - name: Upload device-test build
        uses: actions/upload-artifact@v4
        with:
          name: BackCluster-device-build
          path: ios/build/BackCluster.ipa
          if-no-files-found: error
          retention-days: 7

  opencode-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned OpenCode config and actual read/edit/test client loop
        run: python3 scripts/check-opencode.py
      - name: Upload software client acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-client-software-smoke
          path: .backcluster/opencode-client-smoke.json
          if-no-files-found: error
          retention-days: 7
