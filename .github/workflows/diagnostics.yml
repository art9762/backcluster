name: BackCluster diagnostics

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backcluster-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: scripts/check.sh
      - run: ./backcluster --version

  apple-security:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      # The runner defaults to Xcode 16.4; upstream uses Metal 4 (Xcode 26+).
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: tests/security/run.sh
      - name: Check iOS worker Objective-C++ syntax
        run: |
          xcrun --sdk iphoneos clang++ -std=c++17 -fobjc-arc -fblocks -fsyntax-only \
            -target arm64-apple-ios16.4 \
            -Illama.cpp/include -Illama.cpp/ggml/include -Illama.cpp/ggml/src/ggml-metal \
            ios/Backburner/Sidecar/RPCBridge.mm

  apple-build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the pinned Mac server
        run: ./backcluster build
      - name: Check the compiled launcher options
        run: |
          llama.cpp/build-metal/bin/llama-server --help > /tmp/server-help.txt
          for option in --load-mode --spec-type --alias --cache-type-k --cache-type-v; do
            grep -q -- "$option" /tmp/server-help.txt
          done
      - name: Archive the complete iPhone and iPad app
        run: IPA=1 JOBS=3 scripts/build-backcluster.sh
      - name: Upload device-test build
        uses: actions/upload-artifact@v4
        with:
          name: BackCluster-device-build
          path: ios/build/BackCluster.ipa
          if-no-files-found: error
          retention-days: 7
